version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing AWS CDK CLI..."
      - npm install -g aws-cdk
      - echo "Installing zip and jq utilities for frontend..."
      - yum install -y zip jq

  pre_build:
    commands:
      - echo "=== BACKEND DEPLOYMENT ==="
      - echo "Changing into backend directory"
      - cd backend
      - echo "Installing backend dependencies..."
      - npm ci
      - echo "Installing Lambda function dependencies..."
      - |
        # Install dependencies for all Lambda functions
        for lambda_dir in lambda/*/; do
          if [ -f "${lambda_dir}package.json" ]; then
            echo "Installing dependencies for $(basename $lambda_dir)..."
            (cd "$lambda_dir" && npm ci --production --silent) || echo "Warning: Failed to install dependencies for $lambda_dir"
          fi
        done
      - echo "Building TypeScript..."
      - npm run build
      - echo "Bootstrapping CDK (if not already bootstrapped)..."
      - |
        # Set region from CodeBuild environment (AWS_DEFAULT_REGION is provided by CodeBuild)
        export AWS_REGION=${AWS_DEFAULT_REGION:-$CDK_DEFAULT_REGION}
        echo "Using AWS Region: $AWS_REGION"
        # Check if already bootstrapped to avoid errors
        if aws cloudformation describe-stacks --stack-name CDKToolkit --region $AWS_REGION >/dev/null 2>&1; then
          echo "CDK already bootstrapped, skipping..."
        else
          echo "Bootstrapping CDK for the first time..."
          cdk bootstrap --require-approval never
        fi

  build:
    commands:
      - echo "Deploying CDK stack..."
      - cdk deploy --require-approval never --context environment=production --context amplifyAppId=$AMPLIFY_APP_ID
      - |
        if [ $? -ne 0 ]; then
          echo "CDK deployment failed. Skipping frontend deployment."
          exit 1
        fi
      - echo "CDK deployment complete."
      - echo "Extracting API Gateway URL and Cognito configuration..."
      - cd ..
      - export STACK_NAME=${STACK_NAME:-AdaClaraUnifiedStack}
      - export AWS_REGION=${AWS_DEFAULT_REGION:-$CDK_DEFAULT_REGION}
      - export API_GATEWAY_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' --output text --region $AWS_REGION)
      - |
        # Ensure trailing slash for Next.js static export compatibility
        if [[ ! "$API_GATEWAY_URL" =~ /$ ]]; then
          export API_GATEWAY_URL="${API_GATEWAY_URL}/"
        fi
      - export USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' --output text --region $AWS_REGION)
      - export USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' --output text --region $AWS_REGION)
      - export IDENTITY_POOL_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`IdentityPoolId`].OutputValue' --output text --region $AWS_REGION)
      - export COGNITO_DOMAIN=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CognitoDomain`].OutputValue' --output text --region $AWS_REGION)
      # AMPLIFY_APP_ID and AMPLIFY_BRANCH are passed from deploy.sh as environment variables
      - export FRONTEND_URL="https://${AMPLIFY_BRANCH}.${AMPLIFY_APP_ID}.amplifyapp.com"
      - echo "API Gateway URL=$API_GATEWAY_URL"
      - echo "User Pool ID=$USER_POOL_ID"
      - echo "Region=$AWS_REGION"
      - echo ""
      - echo "Updating Analytics Processor Lambda with runtime configuration..."
      - |
        # Extract DATA_TABLE name from CloudFormation outputs
        DATA_TABLE=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`DataTableName`].OutputValue' \
          --output text \
          --region $AWS_REGION)

        # Update Analytics Processor Lambda environment variables with actual values from CloudFormation
        # This is needed because the Lambda is created with empty API_GATEWAY_URL during CDK deployment
        # Note: AWS_REGION is excluded as it's a reserved Lambda environment variable
        echo "Environment variables being set for ada-clara-analytics-processor:"
        echo "  DATA_TABLE=$DATA_TABLE"
        echo "  API_GATEWAY_URL=$API_GATEWAY_URL"
        echo "  USER_POOL_ID=$USER_POOL_ID"
        echo "  COGNITO_DOMAIN=$COGNITO_DOMAIN"
        echo "  FRONTEND_URL=$FRONTEND_URL"

        if aws lambda update-function-configuration \
          --function-name ada-clara-analytics-processor \
          --environment "Variables={DATA_TABLE=$DATA_TABLE,FRONTEND_URL=$FRONTEND_URL,API_GATEWAY_URL=$API_GATEWAY_URL,USER_POOL_ID=$USER_POOL_ID,USER_POOL_CLIENT_ID=$USER_POOL_CLIENT_ID,IDENTITY_POOL_ID=$IDENTITY_POOL_ID,COGNITO_DOMAIN=$COGNITO_DOMAIN}" \
          --region $AWS_REGION 2>&1; then
          echo "[SUCCESS] Analytics Processor Lambda environment variables updated"
          echo "Verifying Lambda configuration..."
          aws lambda get-function-configuration \
            --function-name ada-clara-analytics-processor \
            --region $AWS_REGION \
            --query 'Environment.Variables.DATA_TABLE' \
            --output text
        else
          echo "[ERROR] Failed to update Lambda environment variables"
          echo "Lambda functions may not work correctly without proper configuration"
          exit 1
        fi
      - echo ""
      - echo "=== FRONTEND DEPLOYMENT ==="
      - cd frontend
      - echo "Installing frontend dependencies..."
      - npm ci
      - echo "Generating runtime configuration file..."
      - |
        # Create runtime-config.json with all configuration values
        # Strip trailing slash from API_GATEWAY_URL to avoid double slashes
        API_BASE_URL_CLEAN="${API_GATEWAY_URL%/}"
        cat > public/runtime-config.json <<EOF
        {
          "apiBaseUrl": "$API_BASE_URL_CLEAN",
          "region": "$AWS_REGION",
          "cognito": {
            "userPoolId": "$USER_POOL_ID",
            "clientId": "$USER_POOL_CLIENT_ID",
            "identityPoolId": "$IDENTITY_POOL_ID",
            "domain": "$COGNITO_DOMAIN",
            "redirectSignIn": "$FRONTEND_URL/auth/callback",
            "redirectSignOut": "$FRONTEND_URL"
          },
          "version": "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
        }
        EOF
      - echo "Generated runtime-config.json:"
      - cat public/runtime-config.json
      - echo "Building Next.js application..."
      - npm run build 2>&1 | tee build.log
      - |
        # Check for build errors in output
        if grep -qi "error" build.log && ! grep -qi "0 error" build.log; then
          echo "[ERROR] Next.js build had errors"
          cat build.log
          exit 1
        fi
        # Validate Next.js build output
        if [ ! -d "out" ] || [ -z "$(ls -A out)" ]; then
          echo "[ERROR] Next.js build failed - no output directory or empty"
          exit 1
        fi
        echo "[SUCCESS] Next.js build completed successfully"
      - echo "Verifying runtime-config.json in build output..."
      - |
        # Verify that runtime-config.json was copied to build output
        cd out
        if [ -f "runtime-config.json" ]; then
          echo "[SUCCESS] runtime-config.json found in build output"
          echo "Config preview:"
          head -5 runtime-config.json
        else
          echo "[ERROR] runtime-config.json not found in build output"
          exit 1
        fi
        cd ..
      - echo "Creating deployment package..."
      - cd out
      - zip -r build.zip .

  post_build:
    commands:
      - echo "Deploying frontend to Amplify..."
      - pwd
      - ls -la
      - echo "Creating Amplify deployment..."
      - |
        # Check for and stop any running deployments first
        echo "Checking for existing deployments..."
        ACTIVE_JOB=$(aws amplify list-jobs --app-id $AMPLIFY_APP_ID --branch-name $AMPLIFY_BRANCH --region $AWS_DEFAULT_REGION --query 'jobSummaries[?status==`PENDING` || status==`PROVISIONING` || status==`RUNNING`].jobId' --output text 2>/dev/null | head -1)

        if [ -n "$ACTIVE_JOB" ] && [ "$ACTIVE_JOB" != "None" ]; then
          echo "[WARNING] Found active deployment job: $ACTIVE_JOB. Stopping it..."
          aws amplify stop-job --app-id $AMPLIFY_APP_ID --branch-name $AMPLIFY_BRANCH --job-id $ACTIVE_JOB --region $AWS_DEFAULT_REGION 2>/dev/null || true
          echo "Waiting 5 seconds for job to stop..."
          sleep 5
        fi

        # Now create deployment
        if aws amplify create-deployment --app-id $AMPLIFY_APP_ID --branch-name $AMPLIFY_BRANCH --region $AWS_DEFAULT_REGION --output json > deployment_response.json 2>&1; then
          echo "[SUCCESS] Amplify deployment created successfully"
        else
          DEPLOYMENT_ERROR=$(cat deployment_response.json)
          echo "[ERROR] Failed to create Amplify deployment"
          cat deployment_response.json
          exit 1
        fi
      - echo "Extracting upload URL and job ID..."
      - |
        # Use jq for safer JSON parsing
        if command -v jq >/dev/null 2>&1; then
          export UPLOAD_URL=$(jq -r '.zipUploadUrl // empty' deployment_response.json)
          export JOB_ID=$(jq -r '.jobId // empty' deployment_response.json)
        else
          # Fallback to node if jq not available
          export UPLOAD_URL=$(node -e "const data=require('./deployment_response.json'); console.log(data.zipUploadUrl)")
          export JOB_ID=$(node -e "const data=require('./deployment_response.json'); console.log(data.jobId)")
        fi
        if [ -z "$UPLOAD_URL" ] || [ -z "$JOB_ID" ]; then
          echo "[ERROR] Failed to extract deployment URLs from response"
          cat deployment_response.json
          exit 1
        fi
      - echo "Uploading build.zip to Amplify..."
      - |
        # We're in frontend/out from line 111
        echo "Current directory: $(pwd)"
        echo "Checking for build.zip..."
        if [ ! -f "build.zip" ]; then
          echo "[ERROR] build.zip not found in current directory"
          ls -la
          exit 1
        fi
        echo "build.zip found, size: $(du -h build.zip | cut -f1)"
        echo "Uploading to Amplify..."
        # Upload with verbose error output
        CURL_OUTPUT=$(curl -X PUT -T build.zip "$UPLOAD_URL" -f -s -S -w "\nHTTP_CODE:%{http_code}" 2>&1)
        CURL_EXIT=$?
        if [ $CURL_EXIT -eq 0 ]; then
          echo "[SUCCESS] Build.zip uploaded successfully"
        else
          echo "[ERROR] Failed to upload build.zip to Amplify"
          echo "Curl exit code: $CURL_EXIT"
          echo "Curl output: $CURL_OUTPUT"
          exit 1
        fi
      - echo "Starting deployment..."
      - aws amplify start-deployment --app-id $AMPLIFY_APP_ID --branch-name $AMPLIFY_BRANCH --job-id $JOB_ID --region $AWS_DEFAULT_REGION || echo "[WARNING] Deployment start command completed (may already be running)"
      - echo "Complete deployment finished successfully!"

